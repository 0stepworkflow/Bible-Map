<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Map</title>
<!-- Start the two font files downloading right away; the browser needs the crossorigin attribute even for fonts on this same site. -->
<link rel="preload" href="fonts/kalam-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/shantell-sans-400-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- Open the connections to the map library and the map's label fonts early, so the map starts sooner. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://demotiles.maplibre.org" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="map"></div>

<button id="legend-toggle" aria-label="Toggle legend">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2V6z"/>
    <path d="M9 4v14M15 6v14"/>
  </svg>
</button>

<!-- The two hand-drawn-look filters that the legend icons share (see design/icons/set1). Width and height 0 keep it invisible but still usable. -->
<svg class="icon-defs" aria-hidden="true" focusable="false">
  <defs>
    <filter id="bm-wander" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0.7"/></filter>
    <filter id="bm-wash" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="2" seed="8" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" result="d"/><feGaussianBlur in="d" stdDeviation="0.25"/></filter>
  </defs>
</svg>

<div id="legend-panel" class="hidden">
  <p class="legend-title">Legend</p>
  <label>
    <input type="checkbox" data-category="person" checked>
    <svg class="legend-icon" viewBox="0 0 24 24" aria-hidden="true"><g filter="url(#bm-wash)" fill="#D4A373" fill-opacity="0.55" stroke="none"><circle cx="12" cy="7.6" r="3.4"/><path d="M5.2 20.2c.4-4 3.1-6.6 6.8-6.6s6.4 2.6 6.8 6.6z"/></g><g filter="url(#bm-wander)" fill="none" stroke="#283618" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.6" r="3.4"/><path d="M5.2 20.2c.4-4 3.1-6.6 6.8-6.6s6.4 2.6 6.8 6.6"/></g></svg>
    People
  </label>
  <label>
    <input type="checkbox" data-category="event" checked>
    <svg class="legend-icon" viewBox="0 0 24 24" aria-hidden="true"><g filter="url(#bm-wash)" fill="#BC6C25" fill-opacity="0.55" stroke="none"><path d="M11 3c.7 4.6 2.3 6.3 6.9 7-4.6.7-6.2 2.4-6.9 7-.7-4.6-2.3-6.3-6.9-7C8.7 9.3 10.3 7.6 11 3z"/></g><g filter="url(#bm-wander)" fill="none" stroke="#283618" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3c.7 4.6 2.3 6.3 6.9 7-4.6.7-6.2 2.4-6.9 7-.7-4.6-2.3-6.3-6.9-7C8.7 9.3 10.3 7.6 11 3z"/><path d="M18.6 14.4c.3 1.9.9 2.5 2.8 2.8-1.9.3-2.5.9-2.8 2.8-.3-1.9-.9-2.5-2.8-2.8 1.9-.3 2.5-.9 2.8-2.8z"/></g></svg>
    Events
  </label>
  <label>
    <input type="checkbox" data-category="landmark" checked>
    <svg class="legend-icon" viewBox="0 0 24 24" aria-hidden="true"><g filter="url(#bm-wash)" fill="#CCD5AE" fill-opacity="0.55" stroke="none"><path d="M3.4 9.6L12 4l8.6 5.6z"/></g><g filter="url(#bm-wander)" fill="none" stroke="#283618" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 9.6L12 4l8.6 5.6z"/><path d="M6.6 12v6M10.2 12v6M13.8 12v6M17.4 12v6"/><path d="M3.6 20.4h16.8M5 18.4h14"/></g></svg>
    Landmarks
  </label>
</div>

<div id="info-panel" class="hidden">
  <div id="info-drag-handle"></div>
  <button id="info-close" aria-label="Close">&times;</button>
  <p id="info-category" class="info-category"></p>
  <h2 id="info-name"></h2>
  <p id="info-summary"></p>
  <ul id="info-bullets" class="hidden"></ul>
  <div id="info-timeline"></div>
  <p id="info-reference"></p>
  <div id="info-nav" class="hidden">
    <button id="info-prev" aria-label="Previous">&larr;</button>
    <span id="info-step-label"></span>
    <button id="info-next" aria-label="Next">&rarr;</button>
  </div>
</div>

<div id="timeline-bar">
  <div id="timeline-track"></div>
  <div id="timeline-center">
    <div id="timeline-year-bubble">5 BC</div>
    <div id="timeline-dot"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script src="js/main.js"></script>
</body>
</html>
